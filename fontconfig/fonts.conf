<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>IosevkaTermSlab Nerd Font Mono</string>
      <string>monospace</string>
    </edit>
  </match>
  <alias>
    <family>Noto Sans CJK</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias>
    <family>Noto Serif CJK</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias>
    <family>Noto Sans Mono CJK</family>
    <prefer><family>Noto Sans Mono CJK SC</family></prefer>
  </alias>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
</fontconfig>
